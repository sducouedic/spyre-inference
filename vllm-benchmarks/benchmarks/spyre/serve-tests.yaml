# Serve benchmarks for Spyre devices
- test_name: serve_granite8B_tp1_in64_out64
  server_health_timeout: 1800
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
    SPYRE_DEVICES: '0'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
  server_parameters:
    model: ibm-ai-platform/micro-g3.3-8b-instruct-1b
    dtype: float16
    load-format: auto
    max-num-seqs: 4
    max-model-len: 128
    port: 8000
    host: 127.0.0.1
  parameters:
    model: ibm-ai-platform/micro-g3.3-8b-instruct-1b
    input-len: 64
    output-len: 64
    num-prompts: 16
    # Warmup requests excluded from metrics (first requests pay per-shape compile).
    num-warmups: 8
    # Match max-num-seqs and burst so the batch fills without queueing.
    max-concurrency: 4
    request-rate: inf
